spring.application.name=caso3-documentos
spring.profiles.active=${APP_PROFILE:demo}
server.port=${PORT:8080}
spring.jpa.open-in-view=false
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_TLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
app.mail.from=${MAIL_FROM:rrhh@empresa.com}
app.mail.mode=${MAIL_MODE:demo}
app.public-url=${PUBLIC_URL:http://localhost:8080}
app.admin.user=${ADMIN_USER:admin}
app.admin.password=${ADMIN_PASSWORD:Admin123!}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.error.include-message=always
