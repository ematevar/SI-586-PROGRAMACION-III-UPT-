<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Panel Principal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/panel}">Minisistema de Pedidos</a>
        <div class="d-flex text-white align-items-center">
            <a th:href="@{/pedidos}" class="btn btn-outline-info btn-sm me-3">Pedidos</a>
            <span class="me-3">Usuario: <span sec:authentication="name"></span></span>
            <form th:action="@{/logout}" method="post"><button type="submit" class="btn btn-outline-light btn-sm">Salir</button></form>
        </div>
    </div>
</nav>
<div class="container mt-4">
    <h2>Gestión de Categorías</h2><hr>
    <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <a th:href="@{/categorias/nueva}" class="btn btn-success mb-3">+ Nueva Categoría</a>
    <table class="table table-striped table-bordered">
        <thead class="table-dark">
        <tr><th>ID</th><th>Nombre</th><th>Descripción</th><th class="text-center">Acciones</th></tr>
        </thead>
        <tbody>
        <tr th:each="cat : ${categorias}">
            <td th:text="${cat.id}"></td>
            <td th:text="${cat.nombre}"></td>
            <td th:text="${cat.descripcion}"></td>
            <td class="text-center">
                <a th:href="@{/categorias/editar/{id}(id=${cat.id})}" class="btn btn-warning btn-sm">Editar</a>
                <form th:action="@{/categorias/eliminar/{id}(id=${cat.id})}" method="post" class="d-inline"
                      onsubmit="return confirm('¿Seguro que deseas eliminar?');">
                    <button type="submit" class="btn btn-danger btn-sm">Eliminar</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(categorias)}"><td colspan="4" class="text-center">Sin registros.</td></tr>
        </tbody>
    </table>
</div>
</body>
</html>
