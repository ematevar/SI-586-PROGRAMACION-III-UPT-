<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${categoria.id != null ? 'Editar' : 'Registrar'}">Categoría</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0" th:text="${categoria.id != null ? 'Editar Categoría' : 'Nueva Categoría'}"></h4>
                </div>
                <div class="card-body">
                    <form th:action="@{${categoria.id != null ? '/categorias/actualizar/' + categoria.id : '/categorias/guardar'}}"
                          th:object="${categoria}" method="post">
                        <input type="hidden" th:field="*{id}">
                        <div class="mb-3"><label>Nombre</label><input type="text" class="form-control" th:field="*{nombre}" required></div>
                        <div class="mb-3"><label>Descripción</label><textarea class="form-control" th:field="*{descripcion}" rows="3"></textarea></div>
                        <div class="d-flex justify-content-between">
                            <a th:href="@{/panel}" class="btn btn-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-success" th:text="${categoria.id != null ? 'Actualizar' : 'Guardar'}"></button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
