<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - Sistema de Pedidos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center" style="height: 100vh;">
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-4">
            <div class="card shadow">
                <div class="card-body">
                    <h3 class="text-center mb-4">Acceso al Sistema</h3>
                    <div th:if="${param.error}" class="alert alert-danger">Credenciales inválidas.</div>
                    <div th:if="${param.logout}" class="alert alert-success">Sesión cerrada.</div>
                    <form th:action="@{/login}" method="post">
                        <div class="mb-3"><label>Usuario</label><input type="text" name="username" class="form-control" required autofocus></div>
                        <div class="mb-3"><label>Contraseña</label><input type="password" name="password" class="form-control" required></div>
                        <button type="submit" class="btn btn-primary w-100">Ingresar</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
