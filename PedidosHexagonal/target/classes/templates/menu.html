<!DOCTYPE html>
 <html lang="es" xmlns:th="http://www.thymeleaf.org">
 <head>
     <meta charset="UTF-8">
     <title>Menú principal</title>
 <meta name="viewport" content="width=device-width, initial-scale=1"><style>body{font:16px Arial,sans-serif;max-width:720px;margin:45px auto;padding:24px;background:#f5f7fb;color:#182438}form,nav{background:white;padding:24px;border:1px solid #dae0ea;border-radius:8px}label{display:block;margin-top:16px}input{box-sizing:border-box;width:100%;padding:10px;margin-top:6px;border:1px solid #adb9cb;border-radius:4px}button{background:#203c70;color:white;border:0;padding:12px 22px;margin-top:18px;border-radius:4px;cursor:pointer}a{color:#254e92}p[th\:errors]{color:#b42318}h1,h2{color:#203c70}</style></head>
 <body>
     <h1>Sistema Pedidos</h1>
     <p>Bienvenido, <strong th:text="${#authentication.name}"></strong></p>
     <nav>
          <a th:if="${#authentication.authorities.?[authority == 'ROLE_ADMIN'].size() > 0}" th:href="@{/empleados}">Registrar y ver empleados</a>
          <br><br>
          <a th:href="@{/clientes}">Registrar y ver clientes</a>
     </nav>
     <br>
     <form th:action="@{/logout}" method="post">
          <button type="submit">Cerrar sesión</button>
     </form>
 </body>
 </html>
